<style id="stShellCss">
body{margin:0;font-family:'Pretendard','Malgun Gothic',sans-serif;background:#f8fafc;color:#0f172a}
#stGate{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#f8fafc,#eef2f8);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
#stGate *{box-sizing:border-box}
#stGate form{width:100%;max-width:380px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 12px 40px rgba(15,23,42,.10);padding:28px 26px 22px}
#stGate label.f{display:block;font-size:11.5px;font-weight:800;color:#475569;margin-bottom:4px}
#stGate input[type=text],#stGate input[type=password]{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font-family:inherit;font-size:13.5px;margin-bottom:11px}
#stGate .chk{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:11.5px;font-weight:700;cursor:pointer}
#stGate .main{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:#1e3a5f;color:#fff;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}
#stGate .main:disabled{opacity:.6;cursor:wait}
#stGate .link{border:0;background:none;color:#0d6d66;font-family:inherit;font-size:11.5px;font-weight:800;text-decoration:underline;cursor:pointer}
#stMsg{margin-top:10px;font-size:11.5px;font-weight:700;text-align:center;min-height:16px;color:#dc2626;line-height:1.6;white-space:pre-line}
#stLoading{position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-size:14px;font-weight:800;color:#475569}
#stBar{position:fixed;left:16px;bottom:16px;z-index:9999;display:none;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 32px);
  background:#fff;border:1px solid #e2e8f0;border-radius:11px;box-shadow:0 6px 20px rgba(15,23,42,.10);padding:6px 10px;font-size:12px;font-weight:700;color:#334155}
#stBar .who b{color:#1e3a5f}
#stBar .sync{padding:3px 8px;border-radius:7px;background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
#stBar .sync.err{background:#fff1f2;color:#be123c;border-color:#fecdd3}
#stBar .sync.busy{background:#eef2ff;color:#4338ca;border-color:#c7d2fe}
#stBar .last{color:#64748b;font-weight:600}
#stBar button{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:3px 9px;font-family:inherit;font-size:12px;font-weight:800;color:#475569;cursor:pointer}
#stToast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:100000;display:none;background:#0f172a;color:#fff;border-radius:11px;padding:10px 18px;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:88vw;white-space:pre-line;text-align:center}
@media print{#stBar,#stToast{display:none!important}}
</style>

async function auCall(payload,timeoutMs){
  payload.key=AU_KEY;
  if(AU.token&&!payload.token&&payload.action!=='auLogin'&&payload.action!=='auSignup')payload.token=AU.token;
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;

  else if(AU._autoErr){ msg.textContent='자동 로그인에 실패했습니다. 다시 로그인해 주세요.\n('+AU._autoErr+')'; AU._autoErr=''; }
  var a=lsGet(AU_AUTO);
  if(a&&a.id){ document.getElementById('stId').value=a.id; var pw=auUnmask(a.p); if(pw)document.getElementById('stPw').value=pw; document.getElementById('stAuto').checked=true; }
  else if(AU.id){ document.getElementById('stId').value=AU.id; }
  setTimeout(function(){ var i=document.getElementById(document.getElementById('stId').value?'stPw':'stId'); if(i)i.focus(); },50);
  document.getElementById('stJoinBtn').onclick=function(){
    var x=document.getElementById('stJoin'), lb=document.getElementById('stLoginBox'), open=x.style.display==='none';
    x.style.display=open?'':'none'; lb.style.display=open?'none':''; this.textContent=open?'← 로그인으로 돌아가기':'＋ 계정 신청'; msg.textContent='';
  };
  document.getElementById('stJSend').onclick=async function(){
    var m=document.getElementById('stJMsg'), id=document.getElementById('stJId').value.trim(), nm=document.getElementById('stJName').value.trim(), pw=document.getElementById('stJPw').value;
    if(!id||!nm||!pw){ m.style.color='#dc2626'; m.textContent='아이디·이름·비밀번호를 모두 입력하세요.'; return; }
    if(!/^[A-Za-z0-9_.-]{3,20}$/.test(id)){ m.style.color='#dc2626'; m.textContent='아이디는 영문·숫자 3~20자로 입력하세요.'; return; }
    this.disabled=true;
    try{ await auCall({action:'auSignup',newId:id,name:nm,pw:pw}); m.style.color='#0d6d66'; m.textContent='신청되었습니다.\n관리자 승인 후 로그인할 수 있습니다.'; }
    catch(e){ m.style.color='#dc2626'; m.textContent=(e.message||e); }
    finally{ this.disabled=false; }
  };
  document.getElementById('stForm').addEventListener('submit',async function(ev){
    ev.preventDefault();
    var id=document.getElementById('stId').value.trim(), pw=document.getElementById('stPw').value, btn=document.getElementById('stBtn');
    if(!id||!pw){ msg.style.color='#dc2626'; msg.textContent='아이디와 비밀번호를 입력하세요.'; return; }
    btn.disabled=true; btn.textContent='확인 중…'; msg.style.color='#64748b'; msg.textContent='';
    try{
      var d=await auCall({action:'auLogin',id:id,pw:pw});
      if(!d||!d.token||!d.user)throw new Error('서버가 로그인 요청을 처리하지 못했습니다.');
      AU.token=d.token; AU.id=d.user.id; AU.name=d.user.name; AU.role=d.user.role; AU.exp=d.exp; auPersist();
      if(document.getElementById('stAuto').checked)lsSet(AU_AUTO,{id:id,p:auMask(pw)}); else lsSet(AU_AUTO,null);
      msg.style.color='#64748b'; msg.textContent='업무분장 자료를 여는 중…';
      await stOpen();
    }catch(e){ msg.style.color='#dc2626'; msg.textContent=stErrText(e); }
    finally{ btn.disabled=false; btn.textContent='로그인'; }
  });
}
function stErrText(e){
  var t=(e&&e.message)||String(e);
  if(e&&e.noServer)t='서버에 업무분장 기능(steam.gs)이 아직 설치되지 않았습니다.\n관리자: 앱스스크립트에 steam.gs 추가 + Code.gs v22 교체 후 «새 버전»으로 배포하세요.';
  return t;
}
function stHideGate(){ var g=document.getElementById('stGate'); if(g)g.remove(); }

/* ── 화면 복호화 (열쇠는 로그인한 사람에게만 서버가 내려줍니다) ── */
function b64ToBytes(s){ var bin=atob(s), u=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
async function stDecrypt(keyB64){
  var all=b64ToBytes(document.getElementById('stPayload').textContent.trim());
  var key=await crypto.subtle.importKey('raw',b64ToBytes(keyB64),{name:'AES-GCM'},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},key,all.slice(12));
  return new TextDecoder().decode(plain);
}
function stInject(html){
  window.__stSource=html;
  var doc=new DOMParser().parseFromString(html,'text/html');
  if(doc.title)document.title=doc.title;
  Array.prototype.forEach.call(doc.head.querySelectorAll('style,link[rel=stylesheet]'),function(n){ document.head.appendChild(document.importNode(n,true)); });
  var scripts=[];
  Array.prototype.forEach.call(doc.body.childNodes,function(n){
    if(n.nodeType===1&&n.tagName==='SCRIPT'){ scripts.push(n.textContent); return; }
    document.body.appendChild(document.importNode(n,true));
  });
  scripts.forEach(function(src){ var s=document.createElement('script'); s.textContent=src; document.body.appendChild(s); });
}

/* ── 서버 자료 적용 ── */
function stValidPerson(d){ return d&&typeof d==='object'&&Array.isArray(d.tasks)&&d.tasks.every(function(t){ return t&&typeof t.task==='string'&&typeof t.cat==='string'&&isFinite(t.adjPct); }); }
/* 앱 스크립트가 처음 실행될 때(첫 화면 그리기 전에) 불립니다 */
window.__stHook=function(){
  var p=ST.initPeople||{};
  Object.keys(p).forEach(function(n){ if(!Object.prototype.hasOwnProperty.call(J,n))return; var it=p[n]; if(!stValidPerson(it.data))return; J[n]=it.data; ST.rev[n]=Number(it.rev)||0; ST.by[n]={by:it.by,at:it.at}; });
  editStatus='';
};
function stCacheLocal(){ try{ localStorage.setItem(EDIT_STORAGE_KEY,JSON.stringify(J)); }catch(_e){} }
function stRerender(){
  try{ renderJ(); }catch(_e){}
  try{ var tp=document.getElementById('panel-team'); if(tp&&tp.classList.contains('active'))renderTeamAnalysis(); }catch(_e2){}
}
/* 서버 자료 중 바뀐 사람만 반영 (편집 중인 사람은 건드리지 않음) */
function stApplyServer(people,quiet){
  var changed=[], held=[];
  Object.keys(people||{}).forEach(function(n){
    if(!Object.prototype.hasOwnProperty.call(J,n))return;
    var it=people[n], r=Number(it.rev)||0;
    if(r===(ST.rev[n]||0)||ST.dirty[n])return;
    if(!stValidPerson(it.data))return;
    if(editDrafts[n]){ if(!ST.held[n]||ST.held[n].rev!==it.rev)held.push(n); ST.held[n]=it; return; }
    J[n]=it.data; ST.rev[n]=r; ST.by[n]={by:it.by,at:it.at}; changed.push(n);
    delete ST.held[n];
  });
  if(changed.length){ stCacheLocal(); stRerender(); }
  if(!quiet&&changed.length){
    var who=changed.map(function(n){ var b=ST.by[n]||{}; return '«'+n+'»'+(b.by?' ('+b.by+')':''); }).join(', ');
    stToast('다른 사용자가 수정한 업무표를 반영했습니다\n'+who,'#0f766e');
  }
  held.forEach(function(n){ var b=ST.held[n]||{}; stToast('지금 편집 중인 «'+n+'» 업무표를 '+(b.by||'다른 사용자')+'님이 먼저 수정했습니다.\n저장할 때 덮어쓸지 물어봅니다.','#b45309'); });
  return changed;
}
function stUpdateBar(){
  var bar=document.getElementById('stBar'); bar.style.display='flex';
  document.getElementById('stWho').textContent=(AU.name||AU.id)+(AU.role&&AU_ROLE[AU.role]?' ('+AU_ROLE[AU.role]+')':'');
  var s=document.getElementById('stSync'), dirty=Object.keys(ST.dirty).length;
  s.className='sync'+(ST.err?' err':(ST.busy?' busy':''));
  s.textContent=ST.err?('⚠ '+ST.err):(ST.busy?'동기화 중…':(dirty?'저장 대기 '+dirty+'건':'✅ 동기화됨 '+(ST.lastOk?stTime(new Date(ST.lastOk).toISOString()):'')));
  var last=ST.log&&ST.log.length?ST.log[ST.log.length-1]:null;
  document.getElementById('stLast').textContent=last?('최근 수정: '+last.by+' · '+(last.names||[]).join(', ')+' · '+stTime(last.at)):'';
}

/* ── 저장 : 사람(업무표) 단위 ── */
async function stSavePeople(names,kind,force){
  names=(names||[]).filter(function(n){ return Object.prototype.hasOwnProperty.call(J,n); });
  if(!names.length)return;
  names.forEach(function(n){ ST.dirty[n]=true; });
  var people={}; names.forEach(function(n){ people[n]={data:J[n],baseRev:ST.rev[n]||0}; });
  ST.busy=true; stUpdateBar();
  var d;
  try{ d=await auCall({action:'stSave',people:people,kind:kind||'edit',force:!!force}); }
  catch(e){
    ST.busy=false;
    if(e&&e.auth){ ST.err='로그인 만료'; stUpdateBar(); if(await auTryAuto()){ ST.err=''; return stSavePeople(names,kind,force); } stShowGate('로그인이 만료되었습니다. 다시 로그인하면 수정한 내용이 서버에 저장됩니다.'); return; }
    ST.err='서버 저장 실패 — 다시 연결되면 자동 저장'; stCacheLocal();
    editStatus='⚠ 서버에 저장하지 못했습니다. 이 PC에 보관했고, 연결되면 자동으로 다시 저장합니다.'; stRerender(); stUpdateBar(); return;
  }
  ST.busy=false; ST.err=''; ST.lastOk=Date.now(); ST.log=d.log||ST.log;
  (d.saved||[]).forEach(function(n){ var it=d.people[n]; ST.rev[n]=Number(it.rev)||0; ST.by[n]={by:it.by,at:it.at}; delete ST.dirty[n]; delete ST.held[n]; });
  var overwrite=[];
  (d.conflicts||[]).forEach(function(c){
    var it=d.people[c.name]; delete ST.dirty[c.name]; delete ST.held[c.name];
    if(kind==='seed'){ if(stValidPerson(it.data)){ J[c.name]=it.data; ST.rev[c.name]=Number(it.rev)||0; ST.by[c.name]={by:it.by,at:it.at}; } return; }
    var ok=confirm((c.by||'다른 사용자')+'님이 '+stTime(c.at)+'에 «'+c.name+'» 업무표를 먼저 수정했습니다.\n\n[확인] 내 수정 내용으로 덮어쓰기\n[취소] 내 수정을 버리고 최신 내용 불러오기');
    if(ok){ overwrite.push(c.name); ST.rev[c.name]=Number(it.rev)||0; }
    else if(stValidPerson(it.data)){ J[c.name]=it.data; ST.rev[c.name]=Number(it.rev)||0; ST.by[c.name]={by:it.by,at:it.at}; }
  });
  if(typeof d.rev==='number'&&!overwrite.length)ST.srvRev=d.rev;
  stCacheLocal();
  if(kind!=='seed'){
    if(d.saved&&d.saved.length)editStatus='저장됨 · 모든 사용자에게 공유됩니다 ('+stTime(new Date().toISOString())+')';
    else if(!overwrite.length&&d.conflicts&&d.conflicts.length)editStatus='최신 내용을 불러왔습니다. 필요하면 다시 수정해 주세요.';
  }
  stRerender(); stUpdateBar();
  if(overwrite.length)return stSavePeople(overwrite,kind,true);
}
window.stSavePeople=stSavePeople;

/* ── 주기적으로 서버 확인 (20초 + 창으로 돌아올 때) ── */
async function stPoll(force,reset){
  if(!ST.booted||ST.busy)return;
  if(document.hidden&&!force)return;
  /* 편집 중이라 미뤄 둔 다른 사용자 수정 — 편집을 끝냈으면(취소 포함) 지금 반영 */
  var hn=Object.keys(ST.held).filter(function(n){ return !editDrafts[n]; });
  if(hn.length){ var hp={}; hn.forEach(function(n){ hp[n]=ST.held[n]; delete ST.held[n]; }); stApplyServer(hp,false); }
  var dirty=Object.keys(ST.dirty);
  if(dirty.length){ await stSavePeople(dirty,'retry'); return; }
  ST.busy=true; stUpdateBar();
  try{
    var d=await auCall({action:'stGet',rev:force?'':ST.srvRev},20000);
    ST.err=''; ST.lastOk=Date.now();
    if(reset)ST.rev={};
    if(!d.unchanged){ ST.log=d.log||ST.log; stApplyServer(d.people,!!reset); ST.srvRev=d.rev; }
  }catch(e){
    if(e&&e.auth){ ST.busy=false; if(await auTryAuto()){ return stPoll(force); } ST.err='로그인 만료'; stUpdateBar(); stShowGate('로그인이 만료되었습니다. 다시 로그인해 주세요.'); return; }
    ST.err='서버 연결 끊김';
  }
  ST.busy=false; stUpdateBar();
}

/* ── 시작 ── */
async function stOpen(){
  var d=await auCall({action:'stGet'});
  if(!d||!d.appKey)throw new Error('서버가 업무분장 열쇠를 보내지 않았습니다.');
  if(d.user){ AU.name=d.user.name||AU.name; AU.role=d.user.role||AU.role; auPersist(); }
  if(!ST.booted){
    var html;
    try{ html=await stDecrypt(d.appKey); }catch(_e){ throw new Error('화면을 여는 열쇠가 맞지 않습니다.\n앱스스크립트 steam.gs 의 ST_APP_KEY 를 확인하세요.'); }
    ST.initPeople=d.people||{}; ST.log=d.log||[];
    stHideGate();
    document.getElementById('stLoading').style.display='none';
    stInject(html);
    ST.booted=true; ST.srvRev=d.rev; ST.lastOk=Date.now();
    /* 서버에 아직 없는 업무표(처음 사용 시)는 이 화면의 내용으로 채웁니다 */
    var missing=Object.keys(J).filter(function(n){ return !(d.people&&d.people[n]); });
    if(missing.length)await stSavePeople(missing,'seed');
    stUpdateBar();
    ST.timer=setInterval(function(){ stPoll(false); },ST_POLL_MS);
    document.addEventListener('visibilitychange',function(){ if(!document.hidden)stPoll(true); });
    window.addEventListener('focus',function(){ stPoll(false); });
    window.addEventListener('beforeunload',function(e){ if(Object.keys(ST.dirty).length||(typeof editDrafts!=='undefined'&&Object.keys(editDrafts).length)){ e.preventDefault(); e.returnValue=''; } });
  }else{
    stHideGate(); ST.err=''; await stPoll(true);
  }
}
window.stPoll=stPoll;
document.getElementById('stRefresh').onclick=function(){ stPoll(true); };
document.getElementById('stLogout').onclick=async function(){
  if(typeof editDrafts!=='undefined'&&Object.keys(editDrafts).length&&!confirm('편집 중인 내용이 있습니다. 로그아웃할까요?'))return;
  try{ await auCall({action:'auLogout'}); }catch(_e){}
  auClear(); lsSet(AU_AUTO,null); location.reload();
};
(async function(){
  var v=lsGet(AU_STORE); if(v&&typeof v==='object'){ AU.token=v.token||''; AU.id=v.id||''; AU.name=v.name||''; AU.role=v.role||''; AU.exp=v.exp||0; }
  if(!window.crypto||!crypto.subtle){ stShowGate('이 브라우저는 암호화 기능을 지원하지 않습니다. 크롬·엣지 최신 버전으로 열어 주세요.\n(파일을 직접 열었다면 https 주소로 접속해 주세요)'); return; }
  if(!auValid())await auTryAuto();
  if(!auValid()){ stShowGate(); return; }
  try{ await stOpen(); }
  catch(e){
    if(e&&e.auth){ auClear(); if(await auTryAuto()){ try{ await stOpen(); return; }catch(e2){ stShowGate(stErrText(e2)); return; } } stShowGate(); return; }
    stShowGate(stErrText(e));
  }
})();
</script>
